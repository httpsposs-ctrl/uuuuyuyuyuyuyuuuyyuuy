<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qexoa | OVERRIDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon: #00f2ff;
            --hot-pink: #ff00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', monospace; }
        body { background: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* ФОН: ГИПЕРПРЫЖОК */
        #starfield { position: absolute; width: 100%; height: 100%; z-index: 0; }

        .hacker-card {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--neon);
            padding: 40px;
            width: 360px;
            position: relative;
            z-index: 10;
            text-align: center;
            animation: card-glitch 4s cubic-bezier(.25, .46, .45, .94) infinite both;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.4);
        }

        /* АНИМИРОВАННАЯ АВАТАРКА С ГЛИТЧЕМ */
        .avatar-box {
            width: 120px; height: 120px; margin: 0 auto 25px;
            border: 3px solid var(--hot-pink);
            position: relative;
            animation: pulse-border 1.5s infinite alternate;
        }

        .profile-img { 
            width: 100%; height: 100%; object-fit: cover; 
            animation: img-glitch 2s infinite linear alternate-reverse;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 10px var(--hot-pink); transform: scale(1); }
            100% { box-shadow: 0 0 30px var(--hot-pink), 0 0 50px var(--neon); transform: scale(1.05); }
        }

        /* ТЕКСТОВЫЕ ЭФФЕКТЫ */
        h1 { 
            color: #fff; font-size: 42px; letter-spacing: 4px; font-weight: 900;
            text-transform: uppercase;
            position: relative;
            animation: text-shake 0.5s infinite;
        }

        .terminal-line { color: #0f0; font-size: 14px; margin-bottom: 30px; text-shadow: 0 0 10px #0f0; }

        /* КНОПКИ */
        .links { display: flex; flex-direction: column; gap: 15px; }

        .btn {
            text-decoration: none; color: #fff;
            border: 1px solid var(--neon);
            padding: 16px; display: flex; align-items: center; justify-content: center;
            gap: 12px; transition: 0.1s; background: rgba(0, 242, 255, 0.1);
            position: relative; overflow: hidden; font-weight: bold;
        }

        .btn:hover {
            background: var(--neon); color: #000;
            box-shadow: 0 0 40px var(--neon);
            transform: skewX(-10deg);
        }

        /* ГЛИТЧ-АНИМАЦИИ */
        @keyframes card-glitch {
            0% { transform: translate(0); }
            1% { transform: translate(-5px, 3px); }
            2% { transform: translate(5px, -3px); }
            3% { transform: translate(0); }
            100% { transform: translate(0); }
        }

        @keyframes img-glitch {
            0% { clip-path: inset(10% 0 30% 0); transform: translateX(-5px); }
            20% { clip-path: inset(40% 0 10% 0); transform: translateX(5px); }
            40% { clip-path: inset(10% 0 50% 0); transform: translateX(-2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translateX(2px); }
            100% { clip-path: inset(10% 0 30% 0); transform: translateX(-5px); }
        }

        @keyframes text-shake {
            0% { text-shadow: 2px 2px var(--hot-pink); }
            25% { text-shadow: -2px -2px var(--neon); }
            50% { text-shadow: 2px -2px var(--hot-pink); transform: translateX(1px); }
            75% { text-shadow: -2px 2px var(--neon); transform: translateX(-1px); }
            100% { text-shadow: 2px 2px var(--hot-pink); }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="hacker-card">
        <div class="avatar-box">
            <img src="avatar.jpg" alt="qexoa" class="profile-img">
        </div>
        
        <h1>qexoa</h1>
        <div class="terminal-line">SYSTEM_ERROR: ROOT_ACCESS_GRANTED</div>

        <div class="links">
            <a href="https://t.me/qexoa" target="_blank" class="btn">
                <i class="fab fa-telegram-plane"></i> НАПИСАТЬ МНЕ
            </a>
            <a href="https://t.me/savvedata" target="_blank" class="btn">
                <i class="fas fa-database"></i> МОЙ ТГК
            </a>
            <a href="https://t.me/qexoa_bot" target="_blank" class="btn">
                <i class="fas fa-robot"></i> SPAMBLOCK BOT
            </a>
        </div>
    </div>

    <script>
        // СКРИПТ ДЛЯ ФОНА "ГИПЕРПРЫЖОК"
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 500;
        const speed = 15;

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width - canvas.width / 2,
                    y: Math.random() * canvas.height - canvas.height / 2,
                    z: Math.random() * canvas.width
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            for (let i = 0; i < numStars; i++) {
                let star = stars[i];
                star.z -= speed;
                if (star.z <= 0) star.z = canvas.width;

                let sx = star.x / (star.z / canvas.width);
                let sy = star.y / (star.z / canvas.width);
                let size = (1 - star.z / canvas.width) * 3;

                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI * 2);
                ctx.fill();
                
                // Рисуем хвост звезды
                ctx.strokeStyle = "rgba(0, 242, 255, " + (1 - star.z / canvas.width) + ")";
                ctx.lineWidth = size;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx * 1.1, sy * 1.1);
                ctx.stroke();
            }
            ctx.restore();
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        drawStars();
    </script>
</body>
</html>
