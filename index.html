<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qexoa | Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        
        body { 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; background: var(--bg-dark); color: white;
        }

        /* Эффект старого монитора */
        body::before {
            content: " ";
            display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #tsparticles { position: absolute; width: 100%; height: 100%; z-index: 0; }

        .cyber-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-blue);
            padding: 40px;
            border-radius: 5px;
            position: relative;
            z-index: 5;
            width: 350px;
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        /* Глитч для ника */
        .glitch {
            font-size: 42px; font-weight: bold; text-transform: uppercase;
            position: relative; text-shadow: 0.05em 0 0 var(--neon-pink), -0.025em -0.05em 0 var(--neon-blue);
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 var(--neon-pink), -0.05em -0.025em 0 var(--neon-blue); }
            14% { text-shadow: 0.05em 0 0 var(--neon-pink), -0.05em -0.025em 0 var(--neon-blue); }
            15% { text-shadow: -0.05em -0.025em 0 var(--neon-pink), 0.025em 0.035em 0 var(--neon-blue); }
            49% { text-shadow: -0.05em -0.025em 0 var(--neon-pink), 0.025em 0.035em 0 var(--neon-blue); }
            50% { text-shadow: 0.025em 0.05em 0 var(--neon-pink), 0.05em 0 0 var(--neon-blue); }
            99% { text-shadow: 0.025em 0.05em 0 var(--neon-pink), 0.05em 0 0 var(--neon-blue); }
            100% { text-shadow: -0.025em 0 0 var(--neon-pink), -0.025em -0.025em 0 var(--neon-blue); }
        }

        .avatar-container {
            width: 120px; height: 120px; margin: 0 auto 20px;
            border: 3px solid var(--neon-pink);
            padding: 5px; filter: drop-shadow(0 0 10px var(--neon-pink));
        }

        .profile-img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.5) contrast(1.2); }

        .links { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }

        .cyber-btn {
            text-decoration: none; color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 12px; display: flex; align-items: center; gap: 10px;
            transition: 0.2s; position: relative; overflow: hidden;
            font-size: 14px; letter-spacing: 2px;
        }

        .cyber-btn:hover {
            background: var(--neon-blue); color: black;
            box-shadow: 0 0 30px var(--neon-blue);
        }

        .cyber-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .cyber-btn:hover::before { left: 100%; }

        .status { font-size: 10px; color: var(--neon-blue); margin-bottom: 20px; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="tsparticles"></div>

    <div class="cyber-card">
        <div class="status">SYSTEM STATUS: ONLINE // ACCESS: GRANTED</div>
        
        <div class="avatar-container">
            <img src="avatar.jpg" alt="qexoa" class="profile-img">
        </div>
        
        <div class="glitch">qexoa</div>
        <div class="status" style="margin-top: 5px;">root@terminal:~# _</div>

        <div class="links">
            <a href="https://t.me/qexoa" target="_blank" class="cyber-btn">
                <i class="fab fa-telegram-plane"></i> DIRECT_MESSAGE
            </a>
            <a href="https://t.me/savvedata" target="_blank" class="cyber-btn">
                <i class="fas fa-database"></i> DATA_STREAM
            </a>
            <a href="https://t.me/qexoa_bot" target="_blank" class="cyber-btn">
                <i class="fas fa-robot"></i> SPAM_SHIELD.EXE
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.0.6/tsparticles.slim.bundle.min.js"></script>
    <script>
        (async () => {
          await tsParticles.load("tsparticles", {
            particles: {
              color: { value: "#00f2ff" },
              links: { color: "#00f2ff", distance: 100, enable: true, opacity: 0.2 },
              move: { enable: true, speed: 2 },
              number: { value: 80 },
              size: { value: 1 }
            }
          });
        })();
    </script>
</body>
</html>
