<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qexoa | Digital Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #00f2ff;
            --secondary: #0061ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Segoe UI', sans-serif; }
        
        body { 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; background: #05050a; position: relative; 
        }

        /* Задний фон */
        #tsparticles { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; }
        
        /* Основная карточка */
        .container {
            background: rgba(10, 10, 25, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 45px 30px;
            border-radius: 40px;
            text-align: center;
            width: 90%;
            max-width: 370px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Анимированная обводка аватарки */
        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 25px;
            padding: 5px;
        }

        .profile-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent), transparent, var(--secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: rotate 3s linear infinite;
        }
        
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .profile-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 242, 255, 0.3);
            background: #111;
        }

        h1 { color: white; font-size: 32px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        
        .terminal { color: #0f0; font-size: 14px; margin-bottom: 30px; font-family: monospace; opacity: 0.9; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .links { display: flex; flex-direction: column; gap: 15px; }

        .link-card {
            background: rgba(255, 255, 255, 0.03);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 20px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .link-card i { font-size: 18px; color: var(--accent); }

        .link-card:hover {
            transform: translateY(-5px);
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.15);
        }

        .link-card.primary {
            background: linear-gradient(45deg, #0088cc, #0061ff);
            border: none;
        }
        .link-card.primary i { color: white; }
    </style>
</head>
<body>

    <div id="tsparticles"></div>

    <div class="container">
        <div class="profile-wrapper">
            <img src="avatar.jpg" alt="qexoa" class="profile-img">
        </div>
        
        <h1>qexoa</h1>
        <div class="terminal">root@terminal:~# _<span class="cursor">|</span></div>

        <div class="links">
            <a href="https://t.me/qexoa" target="_blank" class="link-card primary">
                <i class="fab fa-telegram-plane"></i> Написать мне
            </a>
            
            <a href="https://t.me/savvedata" target="_blank" class="link-card">
                <i class="fas fa-bullhorn"></i> Мой канал
            </a>

            <a href="https://t.me/qexoa_bot" target="_blank" class="link-card">
                <i class="fas fa-robot"></i> SpamBlock Bot
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.0.6/tsparticles.slim.bundle.min.js"></script>
    <script>
        (async () => {
          await tsParticles.load("tsparticles", {
            fpsLimit: 120,
            particles: {
              color: { value: "#00f2ff" },
              links: { 
                color: "#00f2ff", 
                distance: 150, 
                enable: true, 
                opacity: 0.2, 
                width: 1 
              },
              move: { 
                enable: true, 
                speed: 1.2, 
                direction: "none",
                outModes: { default: "out" }
              },
              number: { 
                density: { enable: true, area: 800 }, 
                value: 60 
              },
              opacity: {
                value: { min: 0.1, max: 0.5 },
                animation: { enable: true, speed: 1, sync: false }
              },
              size: { value: { min: 1, max: 3 } },
            },
            detectRetina: true,
          });
        })();
    </script>
</body>
</html>
