<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quake | Bio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
    --bg: #050508;
    --card: rgba(12, 12, 20, 0.7);
    --accent: #6366f1;
    --neon-blue: #3b82f6;
    --text: #ffffff;
    --muted: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #050508 80%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    color: var(--text);
}

/* Эффект свечения */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: rgba(99, 102, 241, 0.15);
    filter: blur(150px);
    border-radius: 50%;
    z-index: 0;
}

.card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    padding: 40px;
    border-radius: 30px;
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.avatar-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    padding: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--neon-blue));
    position: relative;
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: var(--bg);
}

h1 { font-size: 30px; text-align: center; margin-bottom: 5px; }
.username { color: var(--accent); text-align: center; font-weight: 600; margin-bottom: 5px; }
.status { color: var(--muted); text-align: center; font-size: 13px; margin-bottom: 25px; }

.links { display: flex; flex-direction: column; gap: 12px; }

.link {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    color: white;
    text-decoration: none;
    transition: 0.3s;
    font-weight: 500;
}

.link:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
}

.link i { margin-right: 15px; font-size: 18px; }

.footer { margin-top: 30px; text-align: center; color: #475569; font-size: 11px; }
</style>
</head>
<body>

<div class="card">
    <div class="avatar-wrap">
        <img src="avatar.jpg" alt="Quake" class="avatar">
    </div>

    <h1>Quake</h1>
    <div class="username">@qexoa</div>
    <div class="status">developer / designer</div>

    <div class="links">
        <a href="https://t.me/qexoa" class="link"><i class="fab fa-telegram"></i> Telegram</a>
        <a href="https://t.me/savdit" class="link"><i class="fas fa-bullhorn"></i> Channel</a>
        <a href="https://discord.com/users/qexoa" class="link"><i class="fab fa-discord"></i> Discord</a>
        <a href="https://t.me/anonaskbot?start=wrebqmw" class="link"><i class="fas fa-envelope"></i> Anonymous Ask</a>
    </div>

    <div class="footer"></div>
</div>

</body>
</html>
