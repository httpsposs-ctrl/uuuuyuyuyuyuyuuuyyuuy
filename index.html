<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qexoa | System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --grid-color: rgba(0, 242, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', monospace; }
        
        body { 
            background: #000; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            perspective: 1000px;
        }

        /* Анимированный Кибер-фон (Сетка) */
        .cyber-grid {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(0);
            animation: grid-move 5s linear infinite;
            z-index: 0;
        }

        @keyframes grid-move {
            from { transform: rotateX(60deg) translateY(0); }
            to { transform: rotateX(60deg) translateY(50px); }
        }

        /* Затемнение для читаемости */
        .overlay {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000 80%);
            z-index: 1;
        }

        .hacker-card {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--neon-blue);
            padding: 40px 30px;
            width: 350px;
            position: relative;
            z-index: 10;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .avatar-box {
            width: 100px; height: 100px; margin: 0 auto 20px;
            border: 2px solid var(--neon-blue);
            padding: 3px;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .profile-img { width: 100%; height: 100%; object-fit: cover; }

        h1 { 
            color: #fff; font-size: 34px; letter-spacing: 2px; 
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 5px;
        }
        
        .terminal-line { color: #0f0; font-size: 13px; margin-bottom: 30px; }
        .cursor { animation: blink 1s infinite; border-left: 7px solid #0f0; margin-left: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .links { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            text-decoration: none; color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px; display: flex; align-items: center; justify-content: center;
            gap: 12px; transition: 0.3s; background: rgba(255, 255, 255, 0.03);
            text-transform: uppercase; font-size: 13px; letter-spacing: 1px;
        }

        .btn:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn i { color: var(--neon-blue); }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="overlay"></div>

    <div class="hacker-card">
        <div class="avatar-box">
            <img src="avatar.jpg" alt="qexoa" class="profile-img">
        </div>
        
        <h1>qexoa</h1>
        <div class="terminal-line">root@terminal:~# _<span class="cursor"></span></div>

        <div class="links">
            <a href="https://t.me/qexoa" target="_blank" class="btn">
                <i class="fab fa-telegram-plane"></i> Написать мне
            </a>
            <a href="https://t.me/savvedata" target="_blank" class="btn">
                <i class="fas fa-database"></i> Мой ТГК
            </a>
            <a href="https://t.me/qexoa_bot" target="_blank" class="btn">
                <i class="fas fa-robot"></i> SpamBlock Bot
            </a>
        </div>
    </div>

</body>
</html>
